security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # One account type, access by role (ADR-068). Each role includes everything below it; App\Enum\Role is
    # the same ladder in code. ROLE_TECH_SUPPORT is the hidden maintainer tier (ADR-050): super-admin powers,
    # invisible to everyone else on the account-management screens.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]
        ROLE_TECH_SUPPORT: [ROLE_SUPER_ADMIN]

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            # The stateless token APIs: the user API (/api) and the management API (/admin-api), both
            # authenticated with the same personal access tokens. What a token may do is decided by its
            # owner's roles (access_control below + #[IsGranted] on every controller).
            #
            # The PAT authenticator lives in auth-pat-bundle (FEATURE-138 / ADR-010). This firewall references
            # a STABLE core alias, so security.yaml compiles whether or not the bundle is registered. Core
            # aliases app.api_authenticator to App\Security\NullApiAuthenticator (supports()=false → never
            # authenticates); the access_control rules below then refuse every API route (401), so the APIs
            # fail closed without the bundle (issue #27). With the bundle, its compiler pass re-aliases it to
            # the real TokenAuthenticator.
            pattern: ^/(api|admin-api)(/|$)
            stateless: true
            provider: app_users
            user_checker: App\Security\UserChecker
            custom_authenticators:
                - app.api_authenticator
            # 403 for a role that is too low is JSON like every other API error.
            access_denied_handler: App\Security\ApiAccessDeniedHandler
        user:
            host: '%env(APP_DOMAIN)%'
            lazy: true
            provider: app_users
            user_checker: App\Security\UserChecker
            custom_authenticators:
                # The magic-link authenticator lives in auth-magic-link-bundle (FEATURE-140 / ADR-040). A
                # STABLE core alias keeps security.yaml compiling without the bundle: core aliases it to
                # App\Security\NullMagicLinkAuthenticator (supports()=false), and the bundle's compiler pass
                # re-aliases it to the real MagicLinkAuthenticator.
                - app.magic_link_authenticator
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: /dashboard
            remember_me:
                secret: '%kernel.secret%'
                service: App\Security\ConfigAwareRememberMeHandler
            logout:
                path: app_logout
                target: /login

    access_control:
        - { path: ^/admin-api, roles: ROLE_ADMIN }
        # The management screens: any account holding ROLE_ADMIN (or above). Every /admin controller also
        # carries #[IsGranted] for its own minimum role.
        - { path: ^/admin, roles: ROLE_ADMIN }
        # The stateless PAT API. Without this rule /api relied solely on the authenticator, so with auth-pat-bundle
        # removed an application-level /api route ran anonymously (issue #27).
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/resend-verification, roles: PUBLIC_ACCESS }
        - { path: ^/magic-link, roles: PUBLIC_ACCESS }
        - { path: ^/impersonate/exit$, roles: ROLE_USER }
        - { path: ^/2fa, roles: ROLE_USER }
        - { path: ^/account, roles: ROLE_USER }
        - { path: ^/dashboard, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
        firewalls:
            user:
                form_login:
                    enable_csrf: false
